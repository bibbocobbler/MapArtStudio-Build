name: Build Sidebar - Six Colour Methods
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sidebar.yml"
      - "settings-sidebar/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reassemble verified C++ upgrade sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = 0..4 | ForEach-Object { (Get-Content "overlay/part$_.b64" -Raw).Trim() }
          $base64 = $parts -join ''
          $archive = [Convert]::FromBase64String($base64)
          $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($archive)).ToLowerInvariant()
          if ($sha -ne 'ec4d8a0c89df2cd3176841ab0fdcd70b3661464f29ccfa815c0386b316cf775d') { throw "C++ patch archive checksum mismatch: $sha" }
          [IO.File]::WriteAllBytes("$PWD/overlay.tar.gz", $archive)
          tar -xzf overlay.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract patch source" }
      - name: Fetch ImageToMapMC source and submodules
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/AgustinSRG/ImageToMapMC.git source
          git -C source checkout 8cbe2b3e65959d81795986327266a2b26a2ddd95
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Adjust upstream C++ patch for current source
        shell: pwsh
        run: |
          python fix_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply C++ colour, UI and preset changes
        shell: pwsh
        run: |
          python apply_upgrade.py source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore original UI and install six colour methods
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = [Convert]::FromBase64String((Get-Content "original-ui/patch.b64" -Raw).Trim())
          $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($archive)).ToLowerInvariant()
          if ($sha -ne 'efd86124e47bdb8ceb5a3e62a89b245f59a0eeaa1a8d81cf1b264ccddd4f62f7') { throw "Original-UI patch checksum mismatch: $sha" }
          [IO.File]::WriteAllBytes("$PWD/original-ui-colors.tar.gz", $archive)
          tar -xzf original-ui-colors.tar.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python enhance_original_ui.py source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original interface and colour choices
        shell: pwsh
        run: |
          python -c "from pathlib import Path; s=Path('source/src/wx/main_window.cpp').read_text(); assert 'studioToolbar' not in s; assert 'originalImagePanel = new wxImagePanel(this)' in s; assert all(x in s for x in ('Ciede2000', 'Redmean', 'LinearRgb', 'OkLab')); print('Original layout and all six menu methods confirmed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore screenshot-style right-side settings panel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = 0..3 | ForEach-Object { (Get-Content "settings-sidebar/part$_.txt" -Raw).Trim() }
          $compressed = [Convert]::FromBase64String(($parts -join ''))
          [IO.File]::WriteAllBytes("$PWD/sidebar_patch.zlib", $compressed)
          python -c "import pathlib,zlib,hashlib; x=zlib.decompress(pathlib.Path('sidebar_patch.zlib').read_bytes()); assert hashlib.sha256(x).hexdigest() == '578d36f42afd55bee847659691185e7ebfca74ffb9ede764d29dc6595b74274c'; pathlib.Path('add_sidebar.py').write_bytes(x)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python add_sidebar.py source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; s=Path('source/src/wx/main_window.cpp').read_text(); assert 'buildSettingsSidebar' in s and '3D Stacked Carpets' in s and 'Ciede2000' in s and 'exportCarpetUsingOriginal' in s; print('Sidebar and six colour algorithms installed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply and verify NBT exports and carpet defaults
        shell: pwsh
        run: |
          python settings-sidebar/update_exports.py source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python settings-sidebar/validate_exports.py --source source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up vcpkg dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:/vcpkg-mapart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:/vcpkg-mapart/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:/vcpkg-mapart/vcpkg.exe install "wxwidgets:x64-windows" "zlib:x64-windows" "libzip:x64-windows" --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure and build Release GUI + CLI
        shell: pwsh
        run: |
          cmake -S source/src -B source/build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg-mapart/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build source/build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate compiled NBT exporter
        shell: pwsh
        run: |
          $env:PATH = "C:/vcpkg-mapart/installed/x64-windows/bin;" + $env:PATH
          python settings-sidebar/validate_exports.py --exe source/build/Release/mcmap.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package compiled Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item source/build/Release/mcmap-gui.exe artifact/
          if (Test-Path source/build/Release/mcmap.exe) { Copy-Item source/build/Release/mcmap.exe artifact/ }
          Copy-Item C:/vcpkg-mapart/installed/x64-windows/bin/*.dll artifact/ -ErrorAction SilentlyContinue
          if (Test-Path source/LICENSE) { Copy-Item source/LICENSE artifact/ }
          Set-Content artifact/README.txt 'Screenshot-style right settings sidebar and six colour matching algorithms. For legacy carpet modes, copy the original V6 mcmap.exe alongside this program as mcmap-legacy.exe. Keep DLLs together and test all exports in a backup world.'
          @'
          @echo off
          set "SOURCE=%~dp0..\Minecraft.Mapart.Tool.V6\ImageToMapMC-Modified\mcmap.exe"
          if exist "%SOURCE%" (copy "%SOURCE%" "%~dp0mcmap-legacy.exe" & echo Original V6 carpet engine installed.) else (echo Extract the original V6 ZIP and copy mcmap.exe here, renaming it mcmap-legacy.exe.)
          pause
          '@ | Set-Content artifact/INSTALL_CARPET_ENGINE.bat
          Get-ChildItem artifact | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: MapArtStudio-Sidebar-Windows-x64
          path: artifact/
          if-no-files-found: error
